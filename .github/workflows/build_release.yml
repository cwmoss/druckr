# Based on ripgrep's release action:
# https://github.com/BurntSushi/ripgrep/blob/master/.github/workflows/release.yml
# https://github.com/actions/runner-images
name: Build Release Binaries
on:
  workflow_dispatch:

jobs:
  build-release:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          #- target: x86_64-unknown-linux-musl
          #  os: ubuntu-latest
          #  cross: true
          #- target: aarch64-unknown-linux-musl
          #  os: ubuntu-latest
          #  cross: true
          #- target: armv7-unknown-linux-musleabi
          #  os: ubuntu-latest
          #  cross: true
          #- target: riscv64gc-unknown-linux-gnu
          #  os: ubuntu-latest
          #  cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          # - target: aarch64-pc-windows-msvc
          #  os: windows-latest
          #  cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          target: ${{ matrix.target }}

      - name: Run Cross
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross.git --locked --rev 085092ca
          cross build --release --target ${{ matrix.target }}

      - name: Run Cargo
        if: ${{ !matrix.cross }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: create artifact directory
        shell: bash
        run: |
          directory=druckr-${{ matrix.target }}
          mkdir $directory
          cp README.md $directory
          if [ -f target/${{ matrix.target }}/release/druckr.exe ]; then
            cp target/${{ matrix.target }}/release/druckr.exe $directory/
            7z a -r $directory.zip $directory
          else
            cp target/${{ matrix.target }}/release/druckr $directory/
            tar cfz $directory.tar.zip $directory
          fi

      #- uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      #  if: github.event_name == 'workflow_dispatch'
      #  with:
      #    name: druckr-${{ matrix.target }}
      #    path: "druckr-${{ matrix.target }}.*"
      #    retention-days: 3
      #    overwrite: true

      - name: Attach to release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "druckr-${{ matrix.target }}.*"
          tag: v0.1.0
          allowUpdates: true
